<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gobble Dash — The Great Thanksgiving Escape</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; padding: 0; background: #2b1a12; height: 100%; }
  body { display: flex; align-items: center; justify-content: center;
         font-family: Georgia, 'Times New Roman', serif; }
  #frame { position: relative; width: min(96vw, 1280px); }
  canvas { display: block; width: 100%; height: auto; border-radius: 10px;
           box-shadow: 0 12px 48px rgba(0,0,0,.55); background: #f7e8c9;
           image-rendering: auto; cursor: pointer; }
  #hint { color: #e8c98f; text-align: center; font-size: 14px; margin-top: 10px; }
  #hint b { color: #ffd98a; }
</style>
</head>
<body>
  <div id="frame">
    <canvas id="gameCanvas" width="960" height="540" tabindex="0"
            aria-label="Gobble Dash turkey escape game"></canvas>
    <div id="hint">Move <b>&larr; &rarr;</b> or <b>A / D</b> &nbsp;·&nbsp; Jump <b>Space / W / &uarr;</b> &nbsp;·&nbsp; Duck &amp; hide in hay <b>S / &darr;</b> &nbsp;·&nbsp; Pause <b>P</b> &nbsp;·&nbsp; Mute <b>M</b> &nbsp;·&nbsp; Click buttons to start &amp; restart</div>
  </div>
  <script src="src/config.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/art.js"></script>
  <script src="src/world.js"></script>
  <script src="src/turkey.js"></script>
  <script src="src/farmer.js"></script>
  <script src="src/hud.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
